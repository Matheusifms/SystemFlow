<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junim-Stock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
<div class="container">
     <form action="" class="pag-login"><!-- o form permite que tudo que esteja dentro dele seja uma lista permitindo um envio de dados mais facil. -->
          <h1>
            Junim-Stock
          </h1>
         <div class="type-usuario">
             <input type="email" placeholder="Usuario">
             <i class="bx bxs-user"></i>
         </div>
         <div class="type-senha">
            <input type="password" placeholder="Senha">
            <i class="bx bxs-lock-alt"></i>
         </div>
         <div class="lembrar-senha">
              <input type="checkbox" id="lembrar-senha">
              <label for="lebrar-dados">lembrar dados</label>  <!-- mensagem que aparece em volta do input -->
              <a href="#">Esqueci minha-senha</a>
         </div>
     </form>
</div>
</body>
</html>
